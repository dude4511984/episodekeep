[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "episodekeep"
version = "0.1.0"
description = "Keeps a multi-episode story and its quests straight for the AI that plays your character."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
[project.scripts]
episodekeep = "episodekeep.cli:main"
[tool.setuptools]
packages = ["episodekeep"]
